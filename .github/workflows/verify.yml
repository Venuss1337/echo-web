name: Verify
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Nothing that is ignored is tracked
        run: test -z "$(git ls-files -ci --exclude-standard)"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: With an address, at an address
        run: |
          SITE_URL=https://example.com/somewhere bun run build
          grep -q '<link rel="canonical" href="https://example.com/somewhere/"' dist/index.html
          test -f dist/sitemap.xml && test -f dist/404.html && test -f dist/social.jpg
